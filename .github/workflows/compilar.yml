name: Compilar LaTeX

on:
  push:
    branches: [main]
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compilar-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Descobrir documentos principais
        id: notas
        run: |
          docs=()
          pdfs=()
          while IFS= read -r dir; do
            base="$(basename "$dir")"
            if [ -f "$dir/$base.tex" ]; then
              docs+=("$dir/$base.tex")
              pdfs+=("$dir/$base.pdf")
            fi
          done < <(find . -mindepth 1 -maxdepth 1 -type d \
            -not -path './.git*' \
            -not -path '*/arquivos-aux*' | sort)
          if [ "${#docs[@]}" -eq 0 ]; then
            echo "::error::Nenhum documento principal foi encontrado."
            exit 1
          fi
          printf 'Documentos encontrados: %s\n' "${#docs[@]}"
          {
            echo 'docs<<DOCUMENTOS'
            printf '%s\n' "${docs[@]}"
            echo 'DOCUMENTOS'
            echo 'pdfs<<PDFS'
            printf '%s\n' "${pdfs[@]}"
            echo 'PDFS'
          } >> "$GITHUB_OUTPUT"

      - name: Compilar notas de aula
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ steps.notas.outputs.docs }}
          work_in_root_file_dir: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Disponibilizar PDFs para revisão
        uses: actions/upload-artifact@v7
        with:
          name: notas-pdf-${{ github.sha }}
          path: ${{ steps.notas.outputs.pdfs }}
          if-no-files-found: error
